    <section aria-label="Select state to preview" class="flex flex-wrap gap-2">

      <button type="button" onclick="showState(&#39;multi&#39;)" id="st-multi" class="min-h-11 px-3 py-1.5 rounded-full bg-light-surface-container dark:bg-dark-surface-container border border-light-outline-variant dark:border-dark-outline-variant font-label text-label-md">Multiple</button>

      },
      stopped: {
        panelClass: 'flex-1 p-6 rounded-xl bg-light-surface-container dark:bg-dark-surface-container text-light-on-surface dark:text-dark-on-surface border-2 border-light-outline dark:border-dark-outline flex flex-col justify-between gap-5',

    function showState(key) {
      const s = states[key];
      document.getElementById('state-panel').className = s.panelClass;
      document.getElementById('state-badge').className = s.badgeClass;
      document.getElementById('state-badge-icon').textContent = s.badgeIcon;
      document.getElementById('state-badge-text').textContent = s.badgeText;
      document.getElementById('state-hero-icon').className = s.heroIconClass;
      document.getElementById('state-hero-icon').textContent = s.heroIcon;
      document.getElementById('state-title').className = s.titleClass;
      document.getElementById('state-title').textContent = s.title;
      document.getElementById('state-desc').className = s.descClass;
      document.getElementById('state-desc').textContent = s.desc;
      document.getElementById('state-footer-info').querySelector('span:last-child').textContent = s.footerText;

      Object.keys(states).forEach(k => {
        const btn = document.getElementById(`st-${k}`);
        btn.className = k === key
          ? 'min-h-11 px-3 py-1.5 rounded-full bg-light-primary dark:bg-dark-primary text-light-on-primary dark:text-dark-on-primary border-2 border-light-tertiary dark:border-dark-tertiary font-label text-label-md'

      });
    }
