  <script>
    function syncThemeUI() {
      const isDark = document.documentElement.classList.contains('dark');
      document.getElementById('theme-icon').textContent = isDark ? 'light_mode' : 'dark_mode';
      document.getElementById('theme-label').textContent = isDark ? 'Ivory' : 'Dark';
    }
    function toggleTheme() {
      const isDark = document.documentElement.classList.toggle('dark');
      try { localStorage.setItem('drishti-theme', isDark ? 'dark' : 'light'); } catch(e) {}
      syncThemeUI();
    }
    syncThemeUI();
  </script>
