name: Drishti AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript typecheck
        run: npx tsc -b --noEmit

      - name: Run Vitest suite
        run: npm test

      - name: Build production PWA & sync Capacitor
        run: npm run cap:sync

      - name: Run dataset validator tests
        working-directory: .
        run: python3 -m unittest discover -s ai-training/scripts -p "test_*.py"
